/* ------------------------------ Utilitários ------------------------------ */
const cn = (...c) => c.filter(Boolean).join(" ");

const maskPhone = (value) => {
  const d = value.replace(/\D/g, "").slice(0, 11);
  if (d.length <= 2) return d;
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
};

const todayISO = () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};

const scrollToId = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });

/* ------------------------- Componentes de UI ------------------------- */

const Badge = ({ className, ...props }) => (

const Label = ({ className, ...props }) => (

const WhatsAppIcon = ({ className }) => (

    <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.24 8.24 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.22 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.29Z" />

const ScooterImage = ({ model, className, cover = false }) => {
  const [failed, setFailed] = useState(false);
  if (!model.image || failed) {
    return (
      <div className="grid h-full w-full place-items-center bg-gradient-to-b from-neutral-800 to-neutral-950 p-6">
        <ScooterIllustration gid={model.id} tone={model.tone} className={cn("w-full max-w-[22rem] text-neutral-400", className && "")} />
      </div>
    );
  }
  return (
    <img src={model.image} alt={model.name} loading="lazy" onError={() => setFailed(true)}
      className={cn(cover ? "object-cover" : "object-contain drop-shadow-2xl", className)} />
  );
};

    <Card className="group flex flex-col overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:border-amber-400/60 hover:shadow-xl hover:shadow-amber-500/10">
      <div className="relative aspect-[4/5] overflow-hidden bg-neutral-900">
        <div className="absolute left-4 top-4 z-10 flex gap-2">
          <Badge className="border-amber-300/60 bg-amber-50 text-amber-700 dark:border-amber-400/30 dark:bg-amber-400/10 dark:text-amber-300">{model.tag}</Badge>
        </div>
        <ScooterImage model={model} cover className="h-full w-full transition-transform duration-500 group-hover:scale-105" />
      </div>

      <div className="flex flex-1 flex-col p-6">
        <h3 className="text-2xl font-black uppercase tracking-tight">{model.name}</h3>
        <p className="mt-1 text-sm text-neutral-500 dark:text-neutral-400">{model.stock} na loja</p>

        {specs.length > 0 && (
          <div className="mt-4 flex flex-wrap gap-2">
            {specs.map(({ icon: Icon, text }) => (<Badge key={text}><Icon className="h-3.5 w-3.5 text-amber-500" />{text}</Badge>))}
          </div>
        )}

        <p className="mt-5 flex-1 border-t border-neutral-200 pt-4 text-sm text-neutral-600 dark:border-neutral-800 dark:text-neutral-300">
          Valores, condições e ficha técnica com o consultor da loja.
        </p>

        <Button className="mt-4 w-full" onClick={() => onChoose(model.id)}>Quero este modelo</Button>
      </div>
    </Card>
  );
};

  <section id="modelos" className="scroll-mt-16 bg-neutral-50 py-16 dark:bg-neutral-900/40 md:py-24">
    <div className="mx-auto max-w-6xl px-4 sm:px-6">
      <div className="mx-auto max-w-2xl text-center">
        <p className="text-sm font-semibold uppercase tracking-widest text-amber-600 dark:text-amber-400">Vitrine local</p>
        <h2 className="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Modelos disponíveis na loja</h2>
        <p className="mt-3 text-neutral-600 dark:text-neutral-300">
          Escolha o seu favorito e agende para ver de perto. Valores, condições e disponibilidade confirmados pelo consultor da loja.
        </p>
      </div>
      <div className="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        {MODELS.map((m) => <ModelCard key={m.id} model={m} onChoose={onChoose} />)}
      </div>
    </div>
  </section>
);

const Benefits = () => (
  <section id="vantagens" className="scroll-mt-16 py-16 md:py-24">
    <div className="mx-auto max-w-6xl px-4 sm:px-6">
      <div className="mx-auto max-w-2xl text-center">
        <p className="text-sm font-semibold uppercase tracking-widest text-amber-600 dark:text-amber-400">Por que ir à loja física</p>
        <h2 className="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Tudo o que você precisa, na sua cidade</h2>
      </div>

      <div className="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
        {BENEFITS.map(({ icon: Icon, title, text }) => (
          <Card key={title} className="p-6 transition-colors hover:border-amber-400/60">
            <span className="grid h-12 w-12 place-items-center rounded-xl bg-amber-400/15 text-amber-600 dark:text-amber-400"><Icon className="h-6 w-6" /></span>
            <h3 className="mt-4 text-lg font-bold">{title}</h3>
            <p className="mt-2 text-sm leading-relaxed text-neutral-600 dark:text-neutral-400">{text}</p>

      <div className="mt-10 grid gap-4 rounded-2xl border border-amber-400/30 bg-amber-400/10 p-6 sm:grid-cols-3">

          { icon: Leaf, t: "Sustentabilidade", d: "Zero emissão de poluentes no uso diário." },
          { icon: Zap, t: "Autonomia", d: "Bateria removível: carregue em casa ou no trabalho." },
        ].map(({ icon: Icon, t, d }) => (
          <div key={t} className="flex items-start gap-3">

          </div>
        ))}
      </div>
    </div>
  </section>
);

const TestDrive = ({ selectedModel, setSelectedModel }) => {
  const [form, setForm] = useState({ name: "", phone: "", date: "", slot: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const minDate = useMemo(todayISO, []);

  const set = (key) => (e) => {
    const value = key === "phone" ? maskPhone(e.target.value) : e.target.value;
    setForm((f) => ({ ...f, [key]: value }));
    setErrors((er) => ({ ...er, [key]: undefined }));
  };

  const validate = () => {
    const er = {};
    if (form.name.trim().length < 3) er.name = "Informe seu nome.";
    if (form.phone.replace(/\D/g, "").length < 10) er.phone = "Informe um WhatsApp válido com DDD.";
    if (!selectedModel) er.model = "Escolha um modelo.";
    if (!form.date) er.date = "Escolha o melhor dia.";
    if (!form.slot) er.slot = "Escolha o melhor horário.";
    setErrors(er);
    return Object.keys(er).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!validate()) return;
    const model = MODELS.find((m) => m.id === selectedModel);
    const day = new Date(`${form.date}T12:00:00`).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });
    const text = [
      `Olá! Quero agendar um test-drive na ${STORE.name}.`, ``,
      `*Nome:* ${form.name.trim()}`, `*WhatsApp:* ${form.phone}`, `*Modelo:* ${model?.name}`,
      `*Melhor dia:* ${day}`, `*Horário:* ${form.slot}`,
    ].join("\n");
    window.open(`https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
    setSent(true);
  };

  const dk = "border-neutral-700 bg-neutral-950 text-neutral-100";

  return (
    <section id="test-drive" className="relative scroll-mt-16 overflow-hidden bg-neutral-950 py-16 text-white md:py-24">
      <div className="pointer-events-none absolute inset-0">
        <div className="absolute -right-24 top-0 h-96 w-96 rounded-full bg-amber-400/20 blur-3xl" />
        <div className="absolute -left-24 bottom-0 h-80 w-80 rounded-full bg-zinc-500/10 blur-3xl" />
      </div>

      <div className="relative mx-auto grid max-w-6xl items-start gap-10 px-4 sm:px-6 lg:grid-cols-2 lg:gap-16">
        <div className="min-w-0">
          <p className="text-sm font-semibold uppercase tracking-widest text-amber-400">Test-drive grátis</p>
          <h2 className="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl lg:text-5xl">Reserve seu horário e venha pilotar.</h2>
          <p className="mt-4 max-w-md text-neutral-300">
            Preencha 4 campos e o consultor da loja confirma com você pelo WhatsApp. Sem fila, sem burocracia e sem compromisso de compra.
          </p>
          <ol className="mt-8 space-y-5">
            {[
              ["Escolha o modelo e o horário", "Leva menos de 1 minuto."],
              ["Envie pelo WhatsApp", "Sua mensagem já vai pronta para o consultor."],
              ["Venha à loja e teste", "Traga um documento com foto e, se for o caso, sua CNH."],
            ].map(([t, d], i) => (
              <li key={t} className="flex gap-4">
                <span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-amber-400 font-bold text-neutral-950">{i + 1}</span>
                <div><p className="font-semibold">{t}</p><p className="text-sm text-neutral-400">{d}</p></div>
              </li>
            ))}
          </ol>
        </div>

        <Card className="min-w-0 border-neutral-700 bg-neutral-900 p-6 text-neutral-100 shadow-2xl sm:p-8">
          {sent ? (
            <div className="py-8 text-center">
              <span className="mx-auto grid h-14 w-14 place-items-center rounded-full bg-amber-400 text-neutral-950"><Check className="h-7 w-7" strokeWidth={3} /></span>
              <h3 className="mt-4 text-xl font-bold">Quase lá!</h3>
              <p className="mt-2 text-sm text-neutral-300">
                Abrimos o WhatsApp com a sua solicitação. É só tocar em enviar para falar com o consultor da unidade. Se a janela não abriu, tente novamente.
              </p>
              <Button variant="outline" className="mt-6 border-neutral-600 text-neutral-100 hover:bg-neutral-800" onClick={() => setSent(false)}>Fazer outro agendamento</Button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} noValidate className="space-y-5">
              <div>
                <Label htmlFor="name" className="text-neutral-300">Nome</Label>
                <Input id="name" autoComplete="name" placeholder="Como podemos te chamar?" value={form.name} onChange={set("name")} className={dk} />
                <FieldError message={errors.name} />
              </div>
              <div>
                <Label htmlFor="phone" className="text-neutral-300">Telefone / WhatsApp</Label>
                <Input id="phone" type="tel" inputMode="tel" autoComplete="tel" placeholder="(21) 99999-9999" value={form.phone} onChange={set("phone")} className={dk} />
                <FieldError message={errors.phone} />
              </div>
              <div>
                <Label htmlFor="model" className="text-neutral-300">Modelo de interesse</Label>
                <Select id="model" value={selectedModel} onChange={(e) => { setSelectedModel(e.target.value); setErrors((er) => ({ ...er, model: undefined })); }} className={dk}>
                  <option value="">Selecione um modelo</option>
                  {MODELS.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </Select>
                <FieldError message={errors.model} />
              </div>
              <div className="grid gap-5 sm:grid-cols-2">
                <div className="min-w-0">
                  <Label htmlFor="date" className="text-neutral-300">Melhor dia</Label>
                  <Input id="date" type="date" min={minDate} value={form.date} onChange={set("date")} className={cn(dk, "[color-scheme:dark]")} />
                  <FieldError message={errors.date} />
                </div>
                <div className="min-w-0">
                  <Label htmlFor="slot" className="text-neutral-300">Melhor horário</Label>
                  <Select id="slot" value={form.slot} onChange={set("slot")} className={dk}>
                    <option value="">Selecione</option>
                    {TIME_SLOTS.map((s) => <option key={s} value={s}>{s}</option>)}
                  </Select>
                  <FieldError message={errors.slot} />
                </div>
              </div>
              <Button type="submit" variant="whatsapp" size="lg" className="w-full">
                <WhatsAppIcon className="h-6 w-6" /> Agendar pelo WhatsApp
              </Button>
              <p className="text-center text-xs text-neutral-400">
                Seus dados são usados apenas para agendar seu atendimento. Não pedimos pagamentos nem documentos por aqui.
              </p>
            </form>
          )}
        </Card>
      </div>
    </section>
  );
};

const Footer = () => (
  <footer id="contato" className="scroll-mt-16 border-t border-neutral-800 bg-black text-white">
    <div className="mx-auto grid max-w-6xl gap-10 px-4 py-14 sm:px-6 md:grid-cols-4">
      <div>
        <Brand />
        <p className="mt-4 text-sm text-neutral-400">Mobilidade elétrica com atendimento de verdade, perto de você.</p>
      </div>
      <div>
        <h4 className="text-sm font-semibold uppercase tracking-wide">Endereço</h4>
        <p className="mt-3 flex gap-2 text-sm text-neutral-400"><MapPin className="mt-0.5 h-4 w-4 shrink-0 text-amber-500" />{STORE.address}</p>
      </div>
      <div>
        <h4 className="text-sm font-semibold uppercase tracking-wide">Funcionamento</h4>
        <ul className="mt-3 space-y-2 text-sm text-neutral-400">
          {STORE.hours.map((h) => (
            <li key={h.label} className="flex gap-2">
              <Clock className="mt-0.5 h-4 w-4 shrink-0 text-amber-500" />
              <span>{h.label}: <strong className="font-medium text-white">{h.value}</strong></span>
            </li>
          ))}
        </ul>
      </div>
      <div>
        <h4 className="text-sm font-semibold uppercase tracking-wide">Links rápidos</h4>
        <ul className="mt-3 space-y-2 text-sm">
          {[["modelos", "Modelos"], ["vantagens", "Vantagens da loja"], ["test-drive", "Agendar test-drive"]].map(([id, label]) => (
            <li key={id}><button onClick={() => scrollToId(id)} className="text-neutral-400 transition-colors hover:text-amber-400">{label}</button></li>
          ))}
        </ul>
      </div>
    </div>
    <div className="border-t border-neutral-800">
      <p className="mx-auto max-w-6xl px-4 py-6 text-xs leading-relaxed text-neutral-500 sm:px-6">
        Site demonstrativo da loja fictícia {STORE.name}. Imagens ilustrativas; valores e condições meramente exemplificativos.
      </p>
    </div>
  </footer>
);

const FloatingWhatsApp = () => (
  <a
    href={`https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(`Olá! Vi a página da ${STORE.name} e gostaria de mais informações.`)}`}
    target="_blank" rel="noopener noreferrer" aria-label="Falar com a loja no WhatsApp"
    className="fixed z-50 grid h-14 w-14 place-items-center rounded-full bg-[#25D366] text-white shadow-xl shadow-green-600/40 transition-transform hover:scale-110"
    style={{ bottom: "calc(1.25rem + env(safe-area-inset-bottom, 0px))", right: "calc(1.25rem + env(safe-area-inset-right, 0px))" }}
  >
    <WhatsAppIcon className="h-7 w-7" />
  </a>
);

function VoltaUrbanaLanding() {
  const [dark, setDark] = useState(true);
  const [selectedModel, setSelectedModel] = useState("");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
  }, [dark]);

  const chooseModel = (id) => { setSelectedModel(id); scrollToId("test-drive"); };

  return (
    <div className="min-h-screen bg-white text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
      <Header dark={dark} toggleDark={() => setDark((d) => !d)} />
      <main>
        <Hero />
        <Models onChoose={chooseModel} />
        <Benefits />
        <TestDrive selectedModel={selectedModel} setSelectedModel={setSelectedModel} />
      </main>
      <Footer />
      <FloatingWhatsApp />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<VoltaUrbanaLanding />);
</script>

</body></html>
